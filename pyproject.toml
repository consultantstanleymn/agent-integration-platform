[project]
name = "agent-integration-platform"
version = "0.1.0"
description = "Support triage agent platform: connect customer systems, run an LLM agent over their data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Stanley Sujith Nelavala" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6",
  "pypdf>=4",
  "prometheus-client>=0.20",
  "python-multipart>=0.0.9",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=2.0",
  "langgraph-checkpoint-postgres>=2.0",
  "mcp>=1.2,<2",
  "boto3>=1.35",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
dev = ["moto[s3,sqs,secretsmanager,server]>=5.0", "python-hcl2>=4.3", "pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]
local-embed = ["fastembed>=0.4"]

[project.scripts]
aip = "aip.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
markers = ["pg: needs AIP_TEST_PG_URL"]

[tool.coverage.run]
source = ["src/aip", "mock_crm"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "mock_crm"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Header"]

[tool.mypy]
python_version = "3.12"
files = ["src", "mock_crm"]
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aip
          POSTGRES_PASSWORD: aip
          POSTGRES_DB: aip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aip -d aip_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AIP_TEST_PG_URL: postgresql+psycopg://aip:aip@localhost:5432/aip_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests with coverage
        run: pytest --cov --cov-report=term-missing:skip-covered --cov-fail-under=85
      - name: Evals (fake provider, no network)
        run: aip eval run --min-pass-rate 0.9
      - name: Case evals (replay, no network)
        run: aip eval run --suite cases --replay --min-pass-rate 0.95
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/results/latest.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agent-integration-platform .
      - run: docker compose config -q

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra/aws-engagement init -backend=false
      - run: terraform -chdir=infra/aws-engagement validate

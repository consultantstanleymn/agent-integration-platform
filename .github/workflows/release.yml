name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/consultantstanleymn/agent-integration-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
      - uses: sigstore/cosign-installer@v4
      - name: Sign the image by digest
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-image.cdx.json
      - name: Write the release manifest
        run: python scripts/release_manifest.py --image-digest "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Acceptance gate
        run: python scripts/acceptance_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-record
          path: |
            release/manifest.json
            sbom-image.cdx.json
